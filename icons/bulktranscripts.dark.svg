<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">BulkTranscripts</title>
  <desc id="desc">A stack of speech bubbles with the letters B and T and transcript lines</desc>
  <rect width="256" height="256" rx="58" fill="#0F0F0F"/>
  <!-- pages behind the bubble: red furthest, white in between -->
  <rect x="72" y="72" width="144" height="128" rx="22" fill="none" stroke="#FF0000" stroke-width="10"/>
  <rect x="60" y="60" width="144" height="128" rx="22" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <!-- the bubble itself, filled so it occludes the stack, with its tail bottom-left -->
  <path d="M68 48H172A20 20 0 0 1 192 68V156A20 20 0 0 1 172 176H110L84 200V176H68A20 20 0 0 1 48 156V68A20 20 0 0 1 68 48Z" fill="#0F0F0F" stroke="#FF0000" stroke-width="10" stroke-linejoin="round"/>
  <!-- B T -->
  <text x="63" y="139" font-family="Inter, &quot;Arial Black&quot;, Arial, Helvetica, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF">B</text>
  <text x="123" y="139" font-family="Inter, &quot;Arial Black&quot;, Arial, Helvetica, sans-serif" font-weight="900" font-size="80" fill="#FF0000">T</text>
  <!-- transcript lines -->
  <circle cx="73" cy="154" r="5" fill="#FF0000"/>
  <rect x="84" y="149" width="24" height="10" rx="5" fill="#FF0000"/>
  <rect x="116" y="149" width="60" height="10" rx="5" fill="#FFFFFF"/>
  <rect x="68" y="165" width="88" height="10" rx="5" fill="#FFFFFF"/>
</svg>
